async function api(path,options={},retry=2){
  let lastErr;
  for(let i=0;i<=retry;i++){
    try{
      const response=await fetch(path,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}});
      let body;try{body=await response.json()}catch{body=null}
      if(!response.ok||(body&&body.ok===false)){
        const msg=(body&&(body.error||body.message))||(`HTTP ${response.status}`);
        throw new Error(msg);
      }
      return body;
    }catch(e){
      lastErr=e;
      const msg=String(e&&e.message||e);
      if(i<retry && /Failed to fetch|NetworkError|Load failed|fetch/i.test(msg)){
        await new Promise(r=>setTimeout(r,250*(i+1)));
        continue;
      }
      if(/Failed to fetch|NetworkError|Load failed/i.test(msg)){
        throw new Error("无法连接本地修改器服务。请保持启动修改器黑窗口不要关，并完全退出游戏后重开修改器。");
      }
      throw e;
    }
  }
  throw lastErr;
}

function indexedValue(container,index){
  if(Array.isArray(container)) return container[index]??null;
  if(!container||typeof container!=="object") return null;

}

function ensureNewLevelData(d){
  if(!d.newLevelData || typeof d.newLevelData !== "object"){
    d.newLevelData = {levelPack:"p1",p1:{levelsMax:60,lockNum:1},p2:{levelsMax:60,lockNum:0},scoreObj:{}};
  }
  if(!d.newLevelData.p1) d.newLevelData.p1 = {levelsMax:60,lockNum:1};
  if(!d.newLevelData.p2) d.newLevelData.p2 = {levelsMax:60,lockNum:0};
  if(!d.newLevelData.scoreObj || typeof d.newLevelData.scoreObj !== "object") d.newLevelData.scoreObj = {};
  return d.newLevelData;
}
function freeHeartLabel(lv){
  if(!lv) return "未开始";
  if(lv.chapter === "序章") return "序章 " + lv.name;
  return lv.chapter + " " + lv.section + "-" + lv.name;
}
function detectClearedLevelIndex(d){
  const nld = ensureNewLevelData(d);
  const lock = Number(nld.p1.lockNum || 1);
  // lockNum N means indices 0..N-1 accessible; highest likely cleared is N-2 when next is unlocked after clear.
  // Prefer highest scored p1_0_* level; fallback to lockNum-2.
  let best = -1;
  for(const [k,v] of Object.entries(nld.scoreObj || {})){
    const m = /^p1_0_(\d+)$/.exec(k);
    if(!m) continue;
    const lv = Number(m[1]);
    if(Number(v) >= 0 && lv > best) best = lv;
  }
  if(best >= 0) return best;
  return Math.max(-1, lock - 2);
}
function applyStoryProgressToLevel(d, clearedIndex){
  clearedIndex = Number(clearedIndex);
  if(!Number.isInteger(clearedIndex) || clearedIndex < -1 || clearedIndex > freeHeartLevels.length - 1){
    throw new Error("未知关卡进度。");
  }
  const nld = ensureNewLevelData(d);
  nld.levelPack = "p1";
  nld.p1.levelsMax = Math.max(Number(nld.p1.levelsMax || 60), 60);
  // Keep p2 locked for this tool (月球危机暂不处理).
  if(nld.p2 && Number(nld.p2.lockNum || 0) > 0){
    // do not force change existing p2; leave as-is to minimize side effects
  }
  if(clearedIndex < 0){
    nld.p1.lockNum = 1;
    nld.scoreObj = {};
  } else {
    // After clearing C, unlock next C+1 => accessible up to C+1 => lockNum = C+2
    // If final level, lockNum = C+1 still keeps all accessible (0..C).
    const isLast = clearedIndex >= freeHeartLevels.length - 1;
    nld.p1.lockNum = isLast ? (clearedIndex + 1) : (clearedIndex + 2);
    const kept = {};
    for(const [k,v] of Object.entries(nld.scoreObj || {})){
      const m = /^p1_(\d+)_(\d+)$/.exec(k);
      if(!m) continue;
      const lv = Number(m[2]);
      if(lv <= clearedIndex) kept[k] = v;
    }
    for(let lv = 0; lv <= clearedIndex; lv++){
      const key = "p1_0_" + lv;
      if(kept[key] == null) kept[key] = (lv === 0 ? 1 : 10050);
    }
    if(kept["p1_0_0"] == null) kept["p1_0_0"] = 1;
    nld.scoreObj = kept;
  }
  if(Array.isArray(d.levelsLock)) d.levelsLock = [1,0,0,0,0];
  d.modUnlockAll = false;
  d.modAllLevelsPassed = false;
  if(clearedIndex < 0) return {label:"未开始（仅解锁第一关）", lockNum:1, index:-1};
  const lv = freeHeartLevels[clearedIndex];
  return {label:freeHeartLabel(lv), lockNum:nld.p1.lockNum, index:clearedIndex, level:lv};
}
function buildStoryProgressOptions(selectedIndex){
  selectedIndex = Number(selectedIndex);
  let html = '<option value="-1"'+(selectedIndex < 0 ? " selected" : "")+'>未开始（仅解锁第一关）</option>';
  let currentChapter = null;
  for(const lv of freeHeartLevels){
    if(lv.chapter !== currentChapter){
      if(currentChapter !== null) html += "</optgroup>";
      currentChapter = lv.chapter;
      html += '<optgroup label="自由之心 · '+currentChapter+'">';
    }
    const label = freeHeartLabel(lv);
    html += '<option value="'+lv.index+'"'+(selectedIndex === lv.index ? " selected" : "")+'>已通关到：'+label+'</option>';
  }
  if(currentChapter !== null) html += "</optgroup>";
  return html;
}
function waitEditorFrameReady(timeoutMs=8000){

  const timer=setInterval(()=>{
   try{
    const doc=editorFrame.contentDocument;
    if(doc && doc.getElementById && (doc.getElementById("commonGrid") || doc.getElementById("jsonText") || doc.getElementById("notice"))){
      clearInterval(timer);
      resolve(doc);
      return;
    }
    if(Date.now()-started>timeoutMs){
      clearInterval(timer);
      reject(new Error("修改器内页加载超时。请完全退出游戏后重开修改器。"));
    }
  }catch(e){
    if(Date.now()-started>timeoutMs){
      clearInterval(timer);
      reject(new Error("修改器内页无法访问："+((e&&e.message)||e)));
    }
  }
  },50);
 });
}

function getVipRank(d){
  try{
    const nowVip=(d&&d.vipData&&d.vipData.nowVip)?String(d.vipData.nowVip):'';
    // 1.2.6 之前的修改器错误地把 11..14 再拼到 "vipCard_1" 后面，
    // 会写出 vipCard_111..114。识别这些值，用户下次保存时即可自动修正。
    if(/^vipCard_11[1-4]$/.test(nowVip)) return parseInt(nowVip.slice(-1),10);
    if(nowVip.indexOf('vipCard_1')===0){
      const n=parseInt(nowVip.slice(8),10);
      if(n>=11&&n<=14) return n-10;
    }
    // legacy ids vipCard_1..4
    if(/^vipCard_[1-4]$/.test(nowVip)) return parseInt(nowVip.slice(8),10);
  }catch(e){}
  return 0;
}
function ensureVipData(d){
  if(!d.vipData||typeof d.vipData!=='object') d.vipData={};
  if(typeof d.vipData.nowVip!=='string') d.vipData.nowVip='';
  if(typeof d.vipData.durationTime!=='string') d.vipData.durationTime='';
  if(typeof d.vipData.giftGetB!=='boolean') d.vipData.giftGetB=false;
  if(typeof d.vipData.buffGetB!=='boolean') d.vipData.buffGetB=false;
  if(typeof d.vipData.buffTime!=='number') d.vipData.buffTime=0;
  if(typeof d.vipData.experienceTime!=='number') d.vipData.experienceTime=0;
  return d.vipData;
}
function applyVipRank(d,rank){
  const vip=ensureVipData(d);
  rank=Math.max(0,Math.min(4,Number(rank)||0));
  if(rank<=0){
    vip.nowVip='';
    vip.durationTime='';
    vip.buffGetB=false;
    vip.buffTime=0;
    vip.experienceTime=0;
  }else{
    vip.nowVip='vipCard_'+(10+rank); // vipCard_11..vipCard_14
    vip.durationTime=''; // permanent offline
    vip.buffGetB=true;
    if(!(vip.buffTime>0)) vip.buffTime=1;
  }
  d.growVip=rank>0;
  return vip.nowVip;
}
async function completeActiveTasks(){try{busy(true);const {index,saveSlot}=selected();const d=saveSlot.data;if(!d)throw new Error("无效存档");let n=0;const mark=o=>{if(!o||typeof o!=="object")return;const st=String(o.state||"");if(st==="ing"){o.state="complete";n++;if(o.hasOwnProperty("completeNum")&&o.hasOwnProperty("maxNum")){const mx=Number(o.maxNum||o.getAllNum||0);if(!isNaN(mx)&&mx>0)o.completeNum=mx;}if(o.hasOwnProperty("targetNum")&&o.hasOwnProperty("nowNum")){const tn=Number(o.targetNum||0);if(!isNaN(tn)&&tn>0)o.nowNum=tn;}}};const walkArr=a=>{if(Array.isArray(a)){for(const x of a)mark(x);}else if(a&&typeof a==="object"){if(Array.isArray(a.$dense)){for(const x of a.$dense)mark(x);}for(const [k,v] of Object.entries(a)){if(k==="$dense")continue;if(v&&typeof v==="object")mark(v);}}};if(d.taskData){mark(d.taskData.nowTask);walkArr(d.taskData.task5);}if(d.challengeTaskData){mark(d.challengeTaskData.nowTask);walkArr(d.challengeTaskData.arr);if(d.challengeTaskData.challengeFail)d.challengeTaskData.challengeFail="no";}if(d.collectTaskData){mark(d.collectTaskData.nowTask);walkArr(d.collectTaskData.arr);if(d.collectTaskData.nowTask&&d.collectTaskData.nowTask.state==="complete"&&d.collectTaskData.nowTask.targetNum!=null){d.collectTaskData.nowNum=Number(d.collectTaskData.nowTask.targetNum||d.collectTaskData.nowNum||0);} }if(d.weekTaskData){mark(d.weekTaskData.nowTask);walkArr(d.weekTaskData.arr);if(d.weekTaskData.nowTask&&d.weekTaskData.nowTask.state==="complete"&&d.weekTaskData.nowTask.targetNum!=null){d.weekTaskData.nowNum=Number(d.weekTaskData.nowTask.targetNum||d.weekTaskData.nowNum||0);} }const msg=n>0?("已将 "+n+" 个进行中任务标为完成。请回游戏领取奖励。"):"当前没有进行中的任务。";if(typeof saveGear==="function"){await saveGear(index,msg);}else{await save(index,msg);}await load(index);await loadEditor(index);if(typeof show==="function")show(msg);else if(typeof showApiError==="function"){} }catch(e){if(typeof showApiError==="function")showApiError(e);else if(typeof show==="function")show((e&&e.message)||e,true);else alert((e&&e.message)||e);}finally{busy(false);}}
async function prepareLivenessRewardsTest(){try{busy(true);const {index}=selected();const response=await api('/api/editor/prepare-liveness',{method:'POST',body:JSON.stringify({index})});if(response&&response.game_data)gameData=normalizeLocalSlots(response.game_data);await load(index);await loadEditor(index);show("已生成测试状态：全部活跃任务完成，活跃度100，五档奖励均未领取。");}catch(e){show((e&&e.message)||e,true);}finally{busy(false);}}

async function fixZeroCarAffix(){try{busy(true);const sel=selected();const index=sel.index;const response=await api('/api/editor/fix-zero-car-affix',{method:'POST',body:'{}'});if(response&&response.game_data){gameData=response.game_data;}const fixed=Number((response&&response.fixed)||0);let msg=(response&&response.message)||'';if(!msg){msg=fixed>0?('已重roll '+fixed+' 辆属性为0的战车。'):'没有发现属性全为0的战车。';}await load(index);await loadEditor(index);show(msg);}catch(e){show((e&&e.message)||e,true);}finally{busy(false);}}
async function saveSpecialFeatures(){try{busy(true);const doc=editorFrame.contentDocument,{index,saveSlot}=selected(),d=saveSlot.data;for(const key of ["modInfiniteEnergy","modGod","modOneHit","modUnlockAll","modAllLevelsPassed","modCraftFree","modNoExtraCooldown","modNoTaskCooldown","disableAutoCollectLifePer"])d[key]=Boolean(doc.getElementById(key).checked);const vipChecked=doc.querySelector('input[name="vipRank"]:checked');const vipRankValue=vipChecked?Number(vipChecked.value):0;applyVipRank(d,vipRankValue);if(d.challengeTaskData){d.challengeTaskData.readyAt=repairDenseArray(d.challengeTaskData.readyAt);d.challengeTaskData.failArr=repairDenseArray(d.challengeTaskData.failArr);d.challengeTaskData.taskReadyAt=repairDenseArray(d.challengeTaskData.taskReadyAt)}if(d.collectTaskData){d.collectTaskData.readyAt=repairDenseArray(d.collectTaskData.readyAt);d.collectTaskData.taskReadyAt=repairDenseArray(d.collectTaskData.taskReadyAt)}if(d.taskData){d.taskData.slotReadyAt=repairDenseArray(d.taskData.slotReadyAt);d.taskData.normalCardReadyAt=repairDenseArray(d.taskData.normalCardReadyAt)}if(d.modNoTaskCooldown){if(d.challengeTaskData)d.challengeTaskData.taskReadyAt=[];if(d.collectTaskData)d.collectTaskData.taskReadyAt=[];if(d.taskData)d.taskData.slotReadyAt=[0,0,0,0,0]}if(d.modNoExtraCooldown){if(d.extraData)d.extraData.cooldownReadyAt=repairDenseArray(d.extraData.cooldownReadyAt).map(()=>0);if(d.weekExtraData)for(const item of repairDenseArray(d.weekExtraData.arr)){if(item&&typeof item==="object")item.readyAt=0}if(d.specialExtraData)d.specialExtraData.readyAt=repairDenseArray(d.specialExtraData.readyAt).map(()=>0);if(d.challengeTaskData)d.challengeTaskData.taskReadyAt=[]};await saveGear(index,"特殊功能设置已保存。重新进入该存档后生效。")}catch(e){show(e.message,true)}finally{busy(false)}}
function selectedProps(){const selectedSlot=selected();const props=selectedSlot.saveSlot.data.propsItems;if(!props)throw new Error("该存档的道具背包数据不完整。");props.arr=repairDenseArray(props.arr);return {...selectedSlot,props}}
async function add(){try{busy(true);const {index,props}=selectedProps();let card=props.arr.find(x=>x&&x.name==="research_upgrade_card");if(card)card.nowNum=Number(card.nowNum||0)+1;else{if(props.arr.length>=Number(props.bagMaxNum||0))throw new Error("道具背包已满，请先腾出一个格子。");const used=new Set(props.arr.map(x=>Number(x&&x.site))),site=[...Array(Number(props.bagMaxNum||100)).keys()].find(x=>!used.has(x));props.lastID=Number(props.lastID||0)+1;card={addArr:[],affixLevel:0,buyDate:"",cnName:"研发升级卡",define:{},exploreIndex:-1,id:String(props.lastID),imgLabel:"itemsUI/achieve_card_3",name:"research_upgrade_card",newB:true,nowNum:1,site:site??0,type:"card"};props.arr.push(card)}await save(index,"已给予1张研发升级卡。")}catch(e){show(e.message,true)}finally{busy(false)}}

async function changeElite(delta){try{busy(true);const {index,props}=selectedProps();let i=props.arr.findIndex(x=>x&&x.name==="elite_challenge_card"),card=i>=0?props.arr[i]:null;if(delta<0&&!card)throw new Error("该存档没有精英副本挑战卡。");if(card){card.nowNum=Number(card.nowNum||0)+delta;if(card.nowNum<=0)props.arr.splice(i,1)}else{if(props.arr.length>=Number(props.bagMaxNum||0))throw new Error("道具背包已满，请先腾出一个格子。");const used=new Set(props.arr.map(x=>Number(x&&x.site))),site=[...Array(Number(props.bagMaxNum||100)).keys()].find(x=>!used.has(x));props.lastID=Number(props.lastID||0)+1;props.arr.push({addArr:[],affixLevel:0,buyDate:"",cnName:"精英副本挑战卡",define:{},exploreIndex:-1,id:String(props.lastID),imgLabel:"itemsUI/turntable_14",name:"elite_challenge_card",newB:true,nowNum:1,site:site??0,type:"card"})}await save(index,delta>0?"已给予1张精英副本挑战卡。":"已移除1张精英副本挑战卡。")}catch(e){show(e.message,true)}finally{busy(false)}}
async function switchSlot(index){try{busy(true);clearPageError();await loadEditor(Number(index));}catch(e){editorFrame.removeAttribute("srcdoc");editorFrame.src="about:blank";showPageError(e.message||e);show(e.message||e,true);}finally{busy(false);}} mainSlot.onchange=()=>{slot.value=mainSlot.value;switchSlot(mainSlot.value)};slot.onchange=()=>{mainSlot.value=slot.value;switchSlot(slot.value)};
